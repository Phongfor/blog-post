server:
  port: 8080

spring:
  application:
    name: BlogPost

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blog_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

app:
  upload-dir: uploads